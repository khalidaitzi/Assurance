version: 2

models:
  - name: stg_clients
    description: "Clients nettoyés et standardisés"

    columns:
      - name: client_id
        data_tests:
          - unique
          - not_null

      - name: gender
        data_tests:
          - accepted_values:
              arguments:
                values: ['M', 'F']

  - name: stg_products
    description: "Produits d'assurance standardisés"

    columns:
      - name: product_id
        data_tests:
          - unique
          - not_null

      - name: product_category
        data_tests:
          - not_null

  - name: stg_agents
    description: "Agents standardisés"

    columns:
      - name: agent_id
        data_tests:
          - unique
          - not_null

  - name: stg_contracts
    description: "Contrats nettoyés et enrichis"

    columns:
      - name: contract_id
        data_tests:
          - unique
          - not_null

      - name: client_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_clients')
                field: client_id

      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id

      - name: agent_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_agents')
                field: agent_id

      - name: contract_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['ACTIVE', 'EXPIRED', 'CANCELLED']

      - name: annual_premium
        data_tests:
          - not_null

  - name: stg_claims
    description: "Sinistres nettoyés et standardisés"

    columns:
      - name: claim_id
        data_tests:
          - unique
          - not_null

      - name: contract_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_contracts')
                field: contract_id

      - name: claim_status
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - CLOSED
                  - OPEN
                  - REJECTED
                  - UNDER_INVESTIGATION

  - name: stg_payments
    description: "Paiements nettoyés et standardisés"

    columns:
      - name: payment_id
        data_tests:
          - unique
          - not_null

      - name: contract_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_contracts')
                field: contract_id

      - name: payment_status
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - PAID
                  - PENDING
                  - FAILED
                  - REFUNDED